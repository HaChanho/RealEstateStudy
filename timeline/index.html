<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>낙찰물건 타임라인</title>
<link rel="stylesheet" href="../shared/theme.css" />
<style>
  :root{ --positive:#059669; --negative:var(--loss); }   /* --price/--pending 는 소비자 0 */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;font-size:14px}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
  header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
  main{display:flex;gap:16px;padding:16px 20px;align-items:flex-start}
  .col-detail{flex:1;min-width:0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .stub{padding:48px 20px;text-align:center;color:var(--text-dim);line-height:1.7}
  .chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text-dim)}
  .chip b{color:var(--text)}
  .sec-title{font-size:12px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
  table.ledger{width:100%;border-collapse:collapse;font-size:13px}
  table.ledger th,table.ledger td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
  table.ledger td.amt{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
  /* (반응형 HERO 접힘 규칙은 .hero 선언 뒤로 옮겼다 — 순서가 곧 우선순위) */
  /* 375px 에서 표가 카드 폭을 초과해 body 가 가로 스크롤되던 것을 컨테이너로 가둔다. */
  .ledger-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.ledger{min-width:340px}
  table.ledger th:nth-child(1),table.ledger td:nth-child(1),
  table.ledger th:nth-child(2),table.ledger td:nth-child(2){white-space:nowrap}
  /* main 이 flex 라 .stub 이 콘텐츠 폭으로 줄어 text-align:center 가 무력화된다. */
  main > .stub{flex:1 1 auto;width:100%;max-width:560px;margin-inline:auto}
  /* 계획 vs 실제 (§7.5 R1) */
  table.ledger.fc .pct { font-size: 11px; opacity: .8 }
  .fc-cap { font-size: 11px; color: var(--text-mute); margin-top: 4px }
  /* S3 — .kv .v(18px/700)는 숫자 전용. 서술형은 별도 위계로 내린다. */
  /* S2 — pending 마일스톤: opacity:.5 합성으로 명암비 1.65:1(AA 미달)이었다.
     거기 담긴 게 '명도 협의기한'이라는 지금 가장 액션이 필요한 정보다. */
  /* 잔여 하드코딩 토큰화 */
  .card { box-shadow: var(--sh-1); }
  /* ══ 재무 대시보드 (데스크톱) ══
     색은 부호(sign) 하나만 인코딩한다. --price amber 를 모든 금액에 칠하면
     "이건 숫자다"라는 뜻밖에 안 되고 손실 신호를 낼 색이 남지 않는다. */
  main { max-width: 1180px; margin: 0 auto; padding: 20px 20px 64px; display: block; }
  .card { padding: 16px 18px; margin-top: 18px; }
  .sec-title { font-size: 12px; font-weight: 700; color: var(--text-mute);
               text-transform: none; letter-spacing: .02em; margin: 0 0 10px;
               display: flex; justify-content: space-between; align-items: baseline; }
  .sec-sum { font-weight: 600; color: var(--text-dim); font-size: 12px; }
  .dim { color: var(--text-mute); }

  /* #0 식별 바 */
  .idbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
  .idbar .rep { margin-left: auto; font-size: 12px; color: var(--accent); font-weight: 600; text-decoration: none; }
  .idbar .rep:hover { text-decoration: underline; }

  /* #1 HERO — 결론 */
  .hero { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 16px; }
  /* HERO 4타일은 repeat(4,1fr) 고정이다. 1fr 은 minmax(auto,1fr) 이라 트랙이 콘텐츠
     min-content 아래로 못 줄어든다 → 트랙 합이 845px 에서 멈추고, main 내용폭이 그보다
     좁아지는 900px 이하에서 그리드가 부모를 뚫어 페이지가 가로 스크롤됐다(4번째 타일 120px 돌출).
     타일을 좁히는 대신 열 수를 접는다. 4 → 2×2.
     .hero 선언보다 뒤에 두어야 한다 — 미디어 쿼리는 특정도를 올리지 않아 순서가 곧 우선순위다.
     앞쪽에 두면 조건이 맞아도 뒤의 repeat(4,1fr) 에 덮인다(실제로 한 번 덮였다).
     함께 걷어낸 옛 @media(max-width:900px) 의 main{flex-direction:column} .col-list{...} 는
     죽은 코드였다. main 은 display:block 이라 flex-direction 이 무효였고,
     .col-list 는 다중보유 스위처(#hswitch)로 대체돼 DOM 에 더는 생성되지 않는다. */
  @media (max-width: 900px) { .hero { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } }
  .hero-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
               padding: 16px 18px; box-shadow: 0 1px 2px rgb(15 23 42 / .04); min-height: 108px; }
  .hero-card .l { font-size: 12px; color: var(--text-mute); margin-bottom: 6px; }
  .hero-card .v { font-size: 24px; font-weight: 700; line-height: 1.2;
                  font-variant-numeric: tabular-nums; color: var(--text); }
  .hero-card .v.pos { color: var(--positive); }
  .hero-card .v.neg { color: var(--negative); }
  .hero-card .s { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.55; }
  .hero-card .s .warn { color: var(--negative); }

  /* ── 매도가 현실성 (시세 대조) ── */
  .mk-svg { width: 100%; height: auto; display: block; margin-top: 6px; }
  .mk-svg .zone-lo { fill: rgb(220 38 38 / .07); }
  .mk-svg .zone-hi { fill: rgb(5 150 105 / .07); }
  .mk-svg .trade      { fill: var(--n-400); fill-opacity: .75; }
  .mk-svg .trade.self { fill: none; stroke: var(--n-400); stroke-width: 1.5; }
  .mk-svg .auc        { fill: var(--accent); fill-opacity: .75; }
  .mk-svg .auc.out    { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 2 2; }
  .mk-svg .band { fill: var(--n-100); stroke: var(--border-strong); stroke-width: 1; }
  .mk-svg .ref  { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 3 3; }
  .mk-svg .ref.be { stroke: var(--accent-strong); stroke-width: 2.5; stroke-dasharray: none; }
  .mk-svg .rl  { fill: var(--text-mute); font-size: 10.5px; text-anchor: middle; }
  .mk-svg .rl.be { fill: var(--accent-strong); font-weight: 700; }
  .mk-svg .rowlab { fill: var(--text-mute); font-size: 10.5px; text-anchor: end; }
  .mk-fresh { font-size: 11px; font-weight: 600; color: var(--text-mute); margin-left: 8px; }
  .mk-fresh.stale { color: var(--negative); }
  .mx.mkt td.gap.pos { color: var(--positive); font-weight: 700; }
  .mx.mkt td.gap.neg { color: var(--negative); font-weight: 700; }
  .mx.mkt tbody tr.be-row { background: rgb(59 111 222 / .07); }
  .mx.mkt tbody tr.be-row th[scope="row"] { color: var(--accent-strong); font-weight: 700; }
  .mx.mkt td.note { text-align: left; font-size: 11px; color: var(--text-mute); white-space: normal; }
  .mx.mkt td.when { text-align: left; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }

  /* ── 진행 레일 (milestones) ── */
  /* 이 페이지에 milestones 를 그리는 곳이 없었다. 사용자의 "언제"가 과거 지출에만 답해졌다. */
  .rail6 { display: grid; gap: 0; margin: 12px 0 4px; }
  .rail6 .nd { position: relative; text-align: center; padding-top: 22px; }
  .rail6 .nd::before { content: ''; position: absolute; top: 7px; left: 0; right: 50%; height: 2px;
                       background: var(--border-strong); }
  .rail6 .nd:first-child::before { display: none; }
  .rail6 .nd i { position: absolute; top: 1px; left: 50%; transform: translateX(-50%);
                 width: 13px; height: 13px; border-radius: 50%; background: var(--n-0);
                 box-shadow: inset 0 0 0 2px var(--n-300); }
  .rail6 .nd.done i { background: var(--positive); box-shadow: inset 0 0 0 2px var(--positive); }
  .rail6 .nd.done::before { background: var(--positive); }
  .rail6 .nd.next i { box-shadow: inset 0 0 0 3px var(--accent); }
  .rail6 .nd.next .l { color: var(--accent-strong); font-weight: 700; }
  .rail6 .nd .l { font-size: 12px; color: var(--text-dim); font-weight: 600; }
  .rail6 .nd .d { font-size: 11px; color: var(--text-mute); font-variant-numeric: tabular-nums;
                  margin-top: 2px; }
  .rail6 .nd .d.late { color: var(--negative); font-weight: 700; }
  .rail6 .nd.pending .l { color: var(--text-mute); font-weight: 500; }
  .rail-memo { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-top: 10px;
               padding-top: 10px; border-top: 1px solid var(--border); }
  .rail-memo b { color: var(--accent-strong); }

  /* 월별 표 — 실적 행은 진하게, 예정 행은 흐리게 (원장 .grp.planned 규약과 동일) */
  .mx.mon td.amt { color: var(--text-dim); }
  .mx.mon tbody tr.future th[scope="row"], .mx.mon tbody tr.future td { color: var(--text-mute); }
  .mx.mon tbody tr.m0 { background: rgb(59 111 222 / .06); }
  .mx.mon tbody tr.m0 th[scope="row"] { color: var(--accent-strong); font-weight: 700; }
  .mx.mon td.ev { text-align: left; font-size: 11px; color: var(--text-dim); white-space: normal; }
  .mx.mon td.cum { font-weight: 700; color: var(--text); }
  .mx.mon .badge-real { display: inline-block; margin-left: 5px; padding: 0 5px; border-radius: var(--r-pill);
                        font-size: 9.5px; font-weight: 700; background: var(--surface-3); color: var(--text-dim); }

  /* ── 원가 브릿지 (폭포) ── */
  /* 채움은 카테고리가 아니라 '집행 상태'를 인코딩한다 — 원장이 이미 쓰는 어휘를 재사용하고
     새 색을 도입하지 않는다. 집행완료=solid, 예정=옅은 채움+테두리, 미계상=적색 틴트. */
  .wf-svg { width: 100%; height: auto; display: block; }
  .wf-svg .b-done    { fill: var(--n-300); }
  .wf-svg .b-plan    { fill: var(--n-100); stroke: var(--border-strong); stroke-width: 1; }
  .wf-svg .b-unbook  { fill: rgb(220 38 38 / .14); stroke: var(--negative); stroke-width: 1; }
  .wf-svg .b-anchor  { fill: var(--surface-3); stroke: var(--border-strong); stroke-width: 1; }
  .wf-svg .b-total   { fill: rgb(59 111 222 / .16); stroke: var(--accent); stroke-width: 1.5; }
  .wf-svg .conn      { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 2 3; }
  .wf-svg .cut       { stroke: var(--text-mute); stroke-width: 1.5; fill: none; }
  .wf-svg .lab       { fill: var(--text-mute); font-size: 11px; text-anchor: middle; }
  .wf-svg .lab.two   { font-size: 10px; }
  .wf-svg .val       { fill: var(--text-dim); font-size: 11px; text-anchor: middle;
                       font-variant-numeric: tabular-nums; }
  .wf-svg .val.big   { fill: var(--text); font-size: 13px; font-weight: 700; }
  .wf-note { margin-top: 10px; font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .wf-note b { color: var(--text); font-variant-numeric: tabular-nums; }
  .wf-axis { margin-top: 4px; font-size: 11px; color: var(--text-mute); }
  .wf-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 11px;
               color: var(--text-mute); }
  .wf-legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
                 margin-right: 5px; vertical-align: -1px; }
  .wf-legend .k-done   { background: var(--n-300); }
  .wf-legend .k-plan   { background: var(--n-100); box-shadow: inset 0 0 0 1px var(--border-strong); }
  .wf-legend .k-unbook { background: rgb(220 38 38 / .14); box-shadow: inset 0 0 0 1px var(--negative); }

  .mx-sep { height: 1px; background: var(--border); margin: 22px 0 4px; }
  /* ── 매트릭스 표 (항목별 비용 · 민감도) ── */
  .mx { width: 100%; border-collapse: collapse; font-size: 12.5px;
        font-variant-numeric: tabular-nums; margin-top: 10px; }
  .mx caption { caption-side: top; text-align: left; font-size: 11.5px; color: var(--text-mute);
                line-height: 1.6; padding: 0 0 8px; }
  .mx th, .mx td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: right; }
  .mx thead th { font-size: 11px; font-weight: 700; color: var(--text-mute);
                 border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
  .mx th[scope="row"] { text-align: left; font-weight: 600; color: var(--text); white-space: nowrap; }
  .mx td.amt { color: var(--text-dim); }
  .mx td.tot { color: var(--text); font-weight: 700; }
  .mx .z { color: var(--n-300); }
  .mx tfoot th, .mx tfoot td { border-bottom: none; border-top: 1px solid var(--border-strong);
                               font-weight: 700; color: var(--text); }
  /* 비중 칸 — 막대와 숫자를 한 칸에. 막대는 배경이라 숫자를 가리지 않는다. */
  .mx td.share { position: relative; width: 132px; }
  .mx td.share i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
                   height: 14px; background: var(--surface-3); border-radius: 3px; }
  .mx td.share span { position: relative; }

  /* 민감도 격자 — 부호와 크기를 배경 농도로. 숫자는 항상 읽히도록 전경색은 고정. */
  .mx.heat td.c { font-weight: 600; }
  .mx.heat td.c.g1 { background: rgb(5 150 105 / .07); color: var(--positive); }
  .mx.heat td.c.g2 { background: rgb(5 150 105 / .15); color: var(--positive); }
  .mx.heat td.c.g3 { background: rgb(5 150 105 / .26); color: #04543a; }
  .mx.heat td.c.l1 { background: rgb(220 38 38 / .06); color: var(--negative); }
  .mx.heat td.c.l2 { background: rgb(220 38 38 / .13); color: var(--negative); }
  .mx.heat td.c.l3 { background: rgb(220 38 38 / .22); color: #7f1d1d; }
  .mx.heat tbody tr.be th[scope="row"] { color: var(--accent-strong); }
  .mx.heat th[scope="row"] .tagp { display: inline-block; margin-left: 6px; padding: 0 5px;
                 border-radius: var(--r-pill); font-size: 9.5px; font-weight: 700;
                 background: var(--surface-3); color: var(--text-dim); vertical-align: middle; }
  .mx.heat tfoot td { color: var(--text-dim); font-weight: 600; font-size: 11.5px; }

  /* #2 리스크 스트립 */
  .risk-strip { margin-top: 14px; background: var(--surface); border: 1px solid var(--border);
                border-left: 3px solid var(--negative); border-radius: 10px; padding: 12px 16px; }
  .risk-row { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 12.5px; line-height: 1.55; }
  .risk-row b { color: var(--negative); white-space: nowrap; }
  .risk-row span { color: var(--text-dim); }

  /* #3 시나리오 */
  .sim-svg { width: 100%; height: auto; display: block; }
  .sim-svg .grid line { stroke: var(--border); stroke-width: 1; }
  .sim-svg .ylab text, .sim-svg .xlab text { fill: var(--text-mute); font-size: 11px;
                        font-variant-numeric: tabular-nums; }
  .sim-svg .ylab text { text-anchor: end; }
  .sim-svg .xlab text { text-anchor: middle; }
  .sim-svg .be { fill: none; stroke: var(--accent); stroke-width: 2.5; }
  .sim-svg .be.dashed { stroke-dasharray: 6 5; opacity: .75; }
  .sim-svg .ref { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 1 4; }
  .sim-svg .ref-t { fill: var(--text-mute); font-size: 10px; text-anchor: end; }
  .sim-svg #saleline { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 3 3; }
  .sim-svg .now { stroke: var(--text-dim); stroke-width: 1; }
  .sim-svg .now-t { fill: var(--text-dim); font-size: 10px; }
  .sim-svg #zone.gain { fill: rgb(5 150 105 / .13); }
  .sim-svg #zone.loss { fill: rgb(220 38 38 / .13); }
  .sim-svg .cross { fill: var(--text); font-size: 11px; font-weight: 700; }
  .sim-ctl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; margin-top: 16px; }
  .sim-ctl label { font-size: 12px; color: var(--text-mute); }
  .sim-ctl output { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sim-ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .sim-anchors { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .anchor { font-size: 11px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
            border: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim);
            font-family: inherit; font-variant-numeric: tabular-nums; }
  .anchor:hover { border-color: var(--accent); color: var(--text); }
  .sim-out { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px;
             padding-top: 14px; border-top: 1px solid var(--border); }
  .sim-out div { display: flex; flex-direction: column; gap: 3px; }
  .sim-out span { font-size: 12px; color: var(--text-mute); }
  .sim-out b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .sim-out b.pos { color: var(--positive); } .sim-out b.neg { color: var(--negative); }

  /* #4 자금 구조 */
  .fund-bar { display: flex; height: 46px; border-radius: 8px; overflow: hidden; }
  .fund-bar i { display: flex; flex-direction: column; justify-content: center; padding: 0 12px;
                font-style: normal; font-size: 12px; color: var(--text); min-width: 0;
                font-variant-numeric: tabular-nums; }
  .fund-bar i b { font-size: 12px; font-weight: 700; }
  .fund-bar .fs0 { background: var(--surface-3); }
  .fund-bar .fs1 { background: var(--n-100); }
  .fund-eq { font-size: 12px; color: var(--text-dim); margin-top: 8px; }
  .fund-eq.warn { color: var(--negative); font-weight: 600; }
  .fund-terms { font-size: 12.5px; color: var(--text-dim); margin-top: 10px; line-height: 1.6; }

  /* #5 비용 원장 */
  .cost-bar { display: flex; height: 26px; border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  .cost-bar i { display: flex; align-items: center; padding: 0 8px; font-style: normal;
                font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; min-width: 0; }
  .cost-bar i b { font-weight: 700; color: var(--text); margin-right: 4px; }
  .cost-bar .cs0 { background: var(--n-200); } .cost-bar .cs1 { background: var(--n-100); }
  .cost-bar .cs2 { background: var(--surface-3); }
  .grp { margin-bottom: 14px; }
  .grp-head { display: flex; justify-content: space-between; align-items: baseline;
              padding: 7px 0 6px; border-bottom: 1px solid var(--border-strong);
              font-size: 12px; font-weight: 700; color: var(--text-dim); }
  .grp-head b { font-size: 14px; color: var(--text); font-variant-numeric: tabular-nums; }
  .grp-head em { font-style: normal; font-size: 10px; color: var(--text-mute);
                 border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
  .grp.planned .grp-head b, .grp.planned .crow .a { color: var(--text-mute); }
  .grp.unbooked .grp-head { color: var(--negative); border-bottom-color: var(--negative); }
  .grp.unbooked .grp-head b, .grp.unbooked .crow .a { color: var(--negative); }
  .crow { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; padding: 8px 0 5px;
          border-bottom: 1px solid var(--border); }
  .crow .c { font-size: 13px; color: var(--text); }
  .crow .c em { font-style: normal; font-size: 10px; color: var(--text-mute); }
  .crow .a { font-size: 13px; font-weight: 600; text-align: right; color: var(--text);
             font-variant-numeric: tabular-nums; }
  .crow .m { grid-column: 1 / -1; font-size: 12px; color: var(--text-mute);
             line-height: 1.55; max-width: 820px; }   /* 줄길이 상한 */

  /* #6·#7 접힘 섹션 */
  details.fold { margin-top: 18px; background: var(--surface); border: 1px solid var(--border);
                 border-radius: 10px; padding: 0 18px; }
  details.fold > summary { cursor: pointer; padding: 14px 0; font-size: 12px; font-weight: 700;
                           color: var(--text-mute); list-style: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: '▸ '; color: var(--text-mute); }
  details.fold[open] > summary::before { content: '▾ '; }
  details.fold[open] > summary { border-bottom: 1px solid var(--border); }
  details.fold > *:last-child { padding-bottom: 16px; }
  .nb { font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
  .nb.star { background: rgb(59 111 222 / .12); color: var(--accent); }
  .nb.warn { background: rgb(220 38 38 / .12); color: var(--negative); }
  .notes p { max-width: 820px; font-size: 13px; line-height: 1.7; margin: 8px 0; color: var(--text-dim); }
  .notes p.star { border-left: 2px solid var(--accent); padding-left: 10px; }
  .notes p.warn { border-left: 2px solid var(--negative); padding-left: 10px; color: var(--text); }

  /* 포커스링 — 없었다 */
  :where(a, button, input, [tabindex], summary):focus-visible {
    outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  table.ledger.fc .over { color: var(--negative); font-weight: 600; }
  table.ledger.fc .under { color: var(--positive); font-weight: 600; }
  table.ledger.fc .prog { color: var(--text); font-weight: 600; }
  table.ledger.fc .dimc { color: var(--text-mute); }
  table.ledger.fc em.ip { font-style: normal; font-size: 10px; color: var(--text-mute);
                          border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  /* 물건 전환 바 — 2건 이상일 때만. 순차 취득이라 상시 컬럼은 과하다. */
  #hswitch[hidden] { display: none; }
  .hsw { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
         padding: 10px 0 2px; margin-bottom: 4px; }
  .hsw-l { font-size: 12px; color: var(--text-mute); margin-right: 4px; white-space: nowrap; }
  .hsw-l em { font-style: normal; color: var(--text-dim); }
  .hsw-b { display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
           padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
           border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
           min-width: 150px; text-align: left; }
  .hsw-b b { font-size: 13px; font-weight: 600; color: var(--text); }
  .hsw-b span { font-size: 11px; color: var(--text-mute); font-variant-numeric: tabular-nums; }
  .hsw-b:hover { border-color: var(--accent); }
  .hsw-b.on { border-color: var(--accent); background: rgb(59 111 222 / .08);
              box-shadow: inset 3px 0 0 var(--accent); }
  .hsw-b.on b { color: var(--accent-strong); }
  /* 매도완료 물건은 물러난다 — 지난 기록이지 지금 관심사가 아니다 */
  .hsw-b.sold { opacity: .72; }
  .hsw-b.sold.on { opacity: 1; }
  .card.nolink b { display: block; color: var(--negative); font-size: var(--fs-lg); margin-bottom: 8px; }
  .card.nolink p { font-size: 13px; line-height: 1.65; color: var(--text-dim); margin: 6px 0; max-width: 760px; }
  .card.nolink code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px;
                      padding: 1px 5px; font-size: 12px; }
</style>

</head>
<body>
<header><h1>📈 낙찰물건 타임라인</h1></header>
<main id="app"><div class="stub">로딩 중…</div></main>

<!-- 파생 소스(공개): ../calendar/{results,cases}.js. 원장·lib(로컬 전용): ../../_holdings/* (공개선 404→stub). -->
<script>
(function () {
  var v = Date.now();
  function load(src, cb) { var s = document.createElement('script'); s.src = src + '?v=' + v; s.onload = function(){cb(true);}; s.onerror = function(){cb(false);}; document.head.appendChild(s); }
  // 파생 소스(공개) + holdings-lib(공개 이전됨) + crypto-lib(공개) 로드 → 로컬 평문 원장 시도 → boot.
  load('../calendar/results.js', function () {
    load('../calendar/cases.js', function () {
      load('holdings-lib.js', function () {
        load('crypto-lib.js', function () {
          load('../../_holdings/holdings.js', function () { boot(); });
        });
      });
    });
  });

  function boot() {
    // 1계층: 로컬 평문 원장 도달 → 비번 없이 full
    if (window.AUCTION_HOLDINGS && Object.keys(window.AUCTION_HOLDINGS).length) { render(); return; }
    // 2계층: 공개 암호문 blob → 비번 프롬프트
    fetch('holdings.enc.json?v=' + v)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (blob) { if (blob && blob.ct) promptPassword(blob); else render(); }); // 3계층: stub
  }

  // 잠금 화면용 상태 요약. 금액은 절대 포함하지 않는다 — 건수만.
  // 반환값은 정수만 보간하므로 innerHTML 삽입 경로가 안전하다.
  function wonSummary() {
    var n = 0;
    try {
      var R = window.AUCTION_RESULTS || {};
      for (var k in R) if (R[k] && R[k].myResult === 'won') n++;
    } catch (e) { return ''; }
    return n ? '<br>현재 낙찰 ' + n + '건을 보유 중입니다.' : '';
  }

  function promptPassword(blob) {
    var app = document.getElementById('app');
    // 공개 배포에서 지인이 실제로 마주치는 화면은 여기다(enc.json 이 있으면 항상 이 분기).
    // 상태만 노출한다 — 낙찰가·응찰자수 등 금액은 넣지 않는다.
    // wonCount 는 정수 카운터라 innerHTML 삽입 경로가 안전하다.
    app.innerHTML = '<div class="stub"><b>낙찰물건 타임라인은 비공개입니다.</b>'
      + (wonSummary() || '')
      + '<br>여정·비용·손익 상세는 비밀번호로 열람합니다.'
      + '<form id="pwf" style="margin-top:16px">'
      + '<label for="pw" style="display:block;font-size:12px;color:var(--text-mute);margin-bottom:6px">비밀번호</label>'
      + '<input id="pw" type="password" autocomplete="off" placeholder="비밀번호" autofocus '
      + 'style="padding:8px 12px;font-size:14px;border:1px solid var(--border);border-radius:8px;min-width:260px" />'
      + '<button type="submit" style="margin-left:8px;padding:8px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;cursor:pointer">열람</button>'
      + '<div id="pwe" role="status" aria-live="polite" style="color:var(--negative);font-size:12px;margin-top:8px;min-height:16px"></div>'
      + '</form>'
      + '<span style="display:block;margin-top:10px;font-size:12px;color:var(--text-mute)">'
      + '낙찰 결과 요약은 <a href="../calendar/">캘린더</a>에서 볼 수 있습니다.</span></div>';
    // innerHTML 로 삽입된 요소에는 autofocus 속성이 동작하지 않는다 — 명시 호출.
    var pwEl = document.getElementById('pw');
    if (pwEl) pwEl.focus();
    document.getElementById('pwf').addEventListener('submit', function (e) {
      e.preventDefault();
      var el = document.getElementById('pw'), err = document.getElementById('pwe');
      err.textContent = '복호화 중…';
      window.CryptoLib.decryptToJSON(blob, el.value).then(function (obj) {
        window.AUCTION_HOLDINGS = obj; render();
      }).catch(function () { err.textContent = '비밀번호가 올바르지 않습니다.'; el.value = ''; el.focus(); });
    });
  }

  // KST 기준. toISOString()은 UTC라 KST 00:00~09:00(하루의 37.5%)에 전날을 반환한다.
  function today() { return window.CalLib.todayKST(); }
  function won(n) { return n == null ? '—' : '₩' + Math.round(Number(n)).toLocaleString('ko-KR'); }
  var STEP_LABEL = { won:'낙찰', balance:'잔금납부', eviction:'명도완료', repair:'수리완료', listed:'매물등록', sold:'매도' };


  // 계획 vs 실제 대조 (§7.5 R1) — 이 페이지가 존재하는 이유.
  // 원장에 입찰 전 얼려둔 forecast 가 있는데 render() 가 한 번도 읽지 않았다.
  // 이 두 열을 붙이면 페이지 성격이 "내가 뭘 샀나"에서 "내 모델이 얼마나 맞았나"로 바뀐다.
  function forecastHtml(h, f, split) {
    var fc = h && h.forecast;
    if (!fc) return '';
    var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    // 실제 집행분을 카테고리별로 합산 (오늘 이전만 — 예정분은 대조에서 제외)
    var today0 = today();
    var actual = {};
    (h.costs || []).forEach(function (e) {
      if (!e || e.direction === 'in') return;
      if (e.occurredAt && String(e.occurredAt) > today0) return;
      actual[e.category] = (actual[e.category] || 0) + (Number(e.amount) || 0);
    });
    var rows = [];
    // 진행 중 항목(대출이자 등)은 계획이 '기간 총액'이고 실제는 '경과분'이라 같은 기간이 아니다.
    // 구 코드는 이걸 '−90.1% 절감'으로 초록 표시했다 — 손실 신호를 이익 신호로 렌더링한 셈.
    // 진행형은 진행률로, 완결형만 초과/절감으로 판정한다.
    var IN_PROGRESS = ['대출이자', '재산세', '공실관리비', '보험'];
    var pushRow = function (label, planned, real) {
      if (planned == null && real == null) return;
      var inProg = IN_PROGRESS.indexOf(label) >= 0;
      var cell;
      if (planned == null) {
        cell = '<span class="over">계획 없음 · 전액 초과</span>';
      } else if (real == null) {
        cell = '<span class="dimc">미집행</span>';
      } else if (inProg) {
        var p2 = planned ? (real / planned * 100) : 0;
        cell = '<span class="prog">' + p2.toFixed(0) + '% 경과</span>' +
               '<span class="pct"> 잔여 ' + won(Math.max(0, planned - real)).slice(1) + '</span>';
      } else {
        var diff = real - planned;
        var pct = planned ? (diff / planned * 100) : null;
        cell = '<span class="' + (diff > 0 ? 'over' : 'under') + '">' +
          (diff > 0 ? '+' : '−') + won(Math.abs(diff)).slice(1) +
          (pct == null ? '' : ' <span class="pct">' + (pct > 0 ? '+' : '−') + Math.abs(pct).toFixed(1) + '%</span>') +
          '</span>';
      }
      rows.push('<tr><td>' + esc(label) + (inProg ? ' <em class="ip">진행중</em>' : '') + '</td>' +
        '<td class="amt">' + won(planned) + '</td>' +
        '<td class="amt">' + won(real) + '</td>' +
        '<td class="amt">' + cell + '</td></tr>');
    };
    pushRow('낙찰가', fc.projectedBid, f && f.wonPrice);
    var ac = fc.assumedCosts || {};
    Object.keys(ac).forEach(function (k) { pushRow(k, ac[k], actual[k] != null ? actual[k] : null); });
    // 계획에 아예 없던 실제 지출 — forecast 가 과소 잡히는 구조적 원인이라 드러내야 한다
    Object.keys(actual).forEach(function (k) { if (ac[k] == null) pushRow(k, null, actual[k]); });
    if (!rows.length) return '';
    var cap = [];
    if (fc.assumedAt) cap.push(esc(fc.assumedAt) + ' 기준');
    if (fc.bidBasis) cap.push(esc(fc.bidBasis));
    if (fc.frozen) cap.push('입찰 전 확정(frozen)');
    return '<h2 class="sec-title">계획 vs 실제</h2>' +
      '<div class="ledger-wrap"><table class="ledger fc"><thead><tr>' +
      '<th>항목</th><th style="text-align:right">계획</th><th style="text-align:right">실제</th>' +
      '<th style="text-align:right">차이</th></tr></thead><tbody>' + rows.join('') +
      '</tbody></table></div>' +
      (cap.length ? '<div class="fc-cap">' + cap.join(' · ') + '</div>' : '');
  }

  function render() {
    var app = document.getElementById('app');
    var L = window.HoldingsLib, H = window.AUCTION_HOLDINGS;
    // 공개 배포(원장·lib 미도달) 또는 데이터 없음 → stub
    if (!L || !H || !Object.keys(H).length) {
      // 3계층 stub — enc.json 도 없는 배포에서만 도달한다(공개 사이트는 2계층으로 간다).
      app.innerHTML = '<div class="stub"><b>낙찰물건 타임라인은 비공개입니다.</b>'
        + (wonSummary() || '')
        + '<br>여정·비용·손익 상세는 로컬 환경에서만 열람합니다.'
        + '<span style="display:block;margin-top:10px;font-size:12px;color:var(--text-mute)">'
        + '낙찰 결과 요약은 <a href="../calendar/">캘린더</a>에서 볼 수 있습니다.</span></div>';
      return;
    }
    var RESULTS = window.AUCTION_RESULTS || {}, CASES = window.AUCTION_CASES || [];
    var ids = Object.keys(H);
    // L3 — URL 해시로 물건 선택. 캘린더에서 넘어오는 링크(#h-<id>)의 착지점이자,
    // 새로고침 시 선택 유지에도 필요하다(구 코드는 ids[0] 하드코딩).
    function idFromHash() {
      var m = /^#h-(.+)$/.exec(location.hash || '');
      if (!m) return null;
      var want = 'h-' + m[1];
      return ids.indexOf(want) >= 0 ? want : (ids.indexOf(m[1]) >= 0 ? m[1] : null);
    }
    // 물건 정렬 — 보유중이 먼저, 그다음 낙찰일 최신순.
    // 동시 진행이 아니라 순차 취득이므로 "지금 관심 있는 것"이 위로 온다.
    ids.sort(function (a, b) {
      var ha = H[a], hb = H[b];
      var la = ha.disposition === 'sold' ? 1 : 0, lb = hb.disposition === 'sold' ? 1 : 0;
      if (la !== lb) return la - lb;
      var fa = L.deriveAuctionFacts(ha, RESULTS, CASES), fb = L.deriveAuctionFacts(hb, RESULTS, CASES);
      return String(fb.wonDate || '').localeCompare(String(fa.wonDate || ''));
    });

    var sel = idFromHash() || ids[0];
    app.innerHTML = '<div id="hswitch"></div><div class="col-detail" id="detail"></div>';
    window.addEventListener('hashchange', function () {
      var id = idFromHash();
      if (id && id !== sel) { sel = id; draw(); }
    });

    // 물건 전환 바 — 2건 이상일 때만 뜬다.
    // 좌측 300px 컬럼을 상시 내주면 재무 대시보드의 가로가 그만큼 좁아지고,
    // 순차 취득이라 대부분의 시간에 관심 물건은 1개다. 과거 물건은 가끔 들추는 대상이므로
    // 상시 노출이 아니라 얇은 전환 바가 맞다.
    function drawSwitch() {
      var box = document.getElementById('hswitch');
      if (!box) return;
      if (ids.length < 2) { box.innerHTML = ''; box.hidden = true; return; }
      box.hidden = false;
      var sold = ids.filter(function (id) { return H[id].disposition === 'sold'; }).length;
      box.innerHTML =
        '<div class="hsw" role="tablist" aria-label="낙찰 물건 선택">' +
          '<span class="hsw-l">낙찰 물건 ' + ids.length + '건' +
            (sold ? ' <em>보유 ' + (ids.length - sold) + ' · 매도완료 ' + sold + '</em>' : '') +
          '</span>' +
          ids.map(function (id) {
            var h = H[id], f = L.deriveAuctionFacts(h, RESULTS, CASES);
            var on = id === sel;
            var isSold = h.disposition === 'sold';
            return '<button type="button" role="tab" class="hsw-b' + (on ? ' on' : '') +
              (isSold ? ' sold' : '') + '" data-id="' + esc(id) + '" aria-selected="' + on + '">' +
              '<b>' + esc(f.complex || h.holdingId) + '</b>' +
              '<span>' + esc(String(f.wonDate || '').slice(2)) + ' · ' +
                (isSold ? '매도완료' : 'D+' + (L.holdingDays(h, today()) || 0)) + '</span>' +
            '</button>';
          }).join('') +
        '</div>';
      [].slice.call(box.querySelectorAll('.hsw-b')).forEach(function (btn) {
        btn.addEventListener('click', function () {
          sel = btn.dataset.id; draw();
          // 해시를 갱신해 특정 물건 링크를 공유할 수 있게 한다(히스토리는 쌓지 않는다).
          try { history.replaceState(null, '', '#' + sel); } catch (e) {}
        });
      });
      // ← → 로 물건 이동
      box.onkeydown = function (e) {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        var i = ids.indexOf(sel) + (e.key === 'ArrowRight' ? 1 : -1);
        if (i < 0 || i >= ids.length) return;
        sel = ids[i]; draw();
        try { history.replaceState(null, '', '#' + sel); } catch (e2) {}
        var nb = box.querySelector('.hsw-b.on'); if (nb) nb.focus();
      };
    }

    function draw() {
      document.body.classList.toggle('multi', ids.length > 1);
      drawSwitch();
      drawDetail();
    }
    // ── 공용 헬퍼 ──
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      });
    }
    function signed(n) { var v = Math.round(n); return (v >= 0 ? '+' : '−') + won(Math.abs(v)).slice(1); }
    function eok(n) { return (n / 100000000).toFixed(2) + '억'; }

    // 매도가 앵커 — 전부 실제 데이터에서 온다. 임의 시나리오를 만들지 않는다.
    function saleAnchors(f, cd, h, m) {
      var a = [];
      if (f.wonPrice) a.push({ v: f.wonPrice, label: '낙찰' });
      if (cd && cd.neutralSalePrice) a.push({ v: cd.neutralSalePrice, label: '중립' });
      a.push({ v: Math.round(L.breakEvenPrice(h, f, m, cd)), label: '본전' });
      if (f.appraisalPrice) a.push({ v: f.appraisalPrice, label: '감정' });
      return a.sort(function (x, y) { return x.v - y.v; });
    }


    // ── 매도 시나리오: 손익분기 곡선 + 매도가 슬라이더 ──
    // 곡선은 사실상 직선이지만 기울기 자체가 답이다. 사용자 매도가 수평선과의 "교차점 = 마감 기한"은
    // 표로는 안 읽히고 그림으로는 즉시 보인다. 그것 하나가 이 차트의 존재 이유다.
    var SIM = { W: 1040, H: 300, X0: 76, X1: 1004, Y0: 24, Y1: 216, MMAX: 12 };

    function simScale(h, f, cd) {
      var lo = Infinity, hi = -Infinity;
      for (var m = 0; m <= SIM.MMAX; m++) {
        var v = L.breakEvenPrice(h, f, m, cd);
        if (v < lo) lo = v; if (v > hi) hi = v;
      }
      [f.wonPrice, f.appraisalPrice, cd && cd.neutralSalePrice].forEach(function (v) {
        if (v) { if (v < lo) lo = v; if (v > hi) hi = v; }
      });
      var pad = (hi - lo) * 0.18 || 10000000;
      lo -= pad; hi += pad;
      return {
        lo: lo, hi: hi,
        x: function (m) { return SIM.X0 + (SIM.X1 - SIM.X0) * (m / SIM.MMAX); },
        y: function (v) { return SIM.Y1 - (SIM.Y1 - SIM.Y0) * ((v - lo) / (hi - lo)); },
      };
    }

    function buildScenario(h, f, cd, anchors, defaultSale, M0) {
      var sc = simScale(h, f, cd);
      var pts = [];
      for (var m = 0; m <= SIM.MMAX; m++) pts.push(sc.x(m).toFixed(1) + ',' + sc.y(L.breakEvenPrice(h, f, m, cd)).toFixed(1));
      var nowM = Math.max(0, Math.min(SIM.MMAX, monthsSinceBalance(h)));
      var cut = Math.round(nowM) + 1;
      var solid = pts.slice(0, cut).join(' ');
      var dashed = pts.slice(Math.max(0, cut - 1)).join(' ');

      var grid = '', labels = '';
      for (var g = 0; g <= 4; g++) {
        var vy = sc.lo + (sc.hi - sc.lo) * g / 4, py = sc.y(vy);
        grid += '<line x1="' + SIM.X0 + '" y1="' + py.toFixed(1) + '" x2="' + SIM.X1 + '" y2="' + py.toFixed(1) + '"/>';
        labels += '<text x="' + (SIM.X0 - 10) + '" y="' + (py + 4).toFixed(1) + '">' + eok(vy) + '</text>';
      }
      var refs = '';
      [{ v: f.appraisalPrice, t: '감정' }, { v: cd && cd.neutralSalePrice, t: '중립' }, { v: f.wonPrice, t: '낙찰' }]
        .filter(function (r) { return r.v; }).forEach(function (r) {
          var ry = sc.y(r.v);
          refs += '<line class="ref" x1="' + SIM.X0 + '" y1="' + ry.toFixed(1) + '" x2="' + SIM.X1 + '" y2="' + ry.toFixed(1) + '"/>' +
                  '<text class="ref-t" x="' + (SIM.X1 - 4) + '" y="' + (ry - 5).toFixed(1) + '">' + r.t + ' ' + eok(r.v) + '</text>';
        });
      var ticks = '';
      for (var t2 = 0; t2 <= SIM.MMAX; t2 += 3) {
        ticks += '<text class="xt" x="' + sc.x(t2).toFixed(1) + '" y="' + (SIM.Y1 + 20) + '">' + (t2 === 0 ? '잔금' : t2 + '개월') + '</text>';
      }
      var nowX = sc.x(nowM);

      return '<div class="card sim-card">' +
        '<h2 class="sec-title">매도 시나리오</h2>' +
        '<svg class="sim-svg" viewBox="0 0 ' + SIM.W + ' ' + SIM.H + '" role="img" ' +
             'aria-label="보유 기간에 따른 손익분기 매도가 추이">' +
          '<g class="grid">' + grid + '</g><g class="ylab">' + labels + '</g>' +
          '<polygon id="zone" points=""/>' +
          refs +
          '<polyline class="be solid" points="' + solid + '"/>' +
          '<polyline class="be dashed" points="' + dashed + '"/>' +
          '<line id="saleline" x1="' + SIM.X0 + '" x2="' + SIM.X1 + '" y1="0" y2="0"/>' +
          '<line class="now" x1="' + nowX.toFixed(1) + '" y1="' + SIM.Y0 + '" x2="' + nowX.toFixed(1) + '" y2="' + SIM.Y1 + '"/>' +
          '<text class="now-t" x="' + (nowX + 5).toFixed(1) + '" y="' + (SIM.Y0 + 12) + '">오늘</text>' +
          '<g class="xlab">' + ticks + '</g>' +
          '<text id="crosslab" class="cross" x="0" y="0"></text>' +
        '</svg>' +
        '<div class="sim-ctl">' +
          '<label for="saleRange">매도가 가정</label>' +
          '<output id="saleOut">' + won(defaultSale) + '</output>' +
          '<input type="range" id="saleRange" min="' + Math.round(sc.lo) + '" max="' + Math.round(sc.hi) + '" ' +
                 'step="1000000" value="' + defaultSale + '" aria-describedby="saleOut">' +
          '<div class="sim-anchors">' + anchors.map(function (a) {
            return '<button type="button" class="anchor" data-v="' + a.v + '">' + a.label + ' ' + eok(a.v) + '</button>';
          }).join('') + '</div>' +
        '</div>' +
        '<div class="sim-out">' +
          [3, 4, 6].map(function (m) {
            return '<div><span>' + m + '개월</span><b data-m="' + m + '"></b></div>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    function monthsSinceBalance(h) {
      var b = (h.milestones || []).find(function (m) { return m.key === 'balance'; });
      if (!b || !b.at) return 0;
      return Math.max(0, L.daysBetween(b.at, today()) / 30.44);
    }

    function bindScenario(h, f, cd, M0) {
      var range = document.getElementById('saleRange');
      if (!range) return;
      var sc = simScale(h, f, cd);
      var out = document.getElementById('saleOut');
      var line = document.getElementById('saleline');
      var zone = document.getElementById('zone');
      var crossLab = document.getElementById('crosslab');
      var outs = [].slice.call(document.querySelectorAll('.sim-out b'));

      function paint() {
        var P = Number(range.value);
        out.textContent = won(P);
        var y = sc.y(P);
        line.setAttribute('y1', y); line.setAttribute('y2', y);
        // 교차점 = 이 가격으로 본전이 되는 마지막 시점 = 마감 기한
        var cross = null;
        for (var m = 0; m <= SIM.MMAX; m++) { if (L.breakEvenPrice(h, f, m, cd) > P) { cross = m; break; } }
        var cx = cross == null ? SIM.X1 : sc.x(cross);
        zone.setAttribute('points',
          SIM.X0 + ',' + y + ' ' + cx.toFixed(1) + ',' + y + ' ' + cx.toFixed(1) + ',' + SIM.Y1 + ' ' + SIM.X0 + ',' + SIM.Y1);
        zone.setAttribute('class', cross === 0 ? 'loss' : 'gain');
        if (cross != null && cross > 0) {
          crossLab.setAttribute('x', Math.min(cx + 6, SIM.X1 - 90));
          crossLab.setAttribute('y', y - 8);
          crossLab.textContent = '이 가격 마감 ' + cross + '개월';
        } else if (cross === 0) { crossLab.textContent = '이미 본전 아래'; crossLab.setAttribute('x', SIM.X0 + 6); crossLab.setAttribute('y', y - 8); }
        else { crossLab.textContent = ''; }
        outs.forEach(function (b) {
          var m = Number(b.dataset.m);
          var v = L.pretaxProfit(h, f, P, m, cd);
          b.textContent = signed(v);
          b.className = v >= 0 ? 'pos' : 'neg';
        });
      }
      range.addEventListener('input', paint);
      [].slice.call(document.querySelectorAll('.anchor')).forEach(function (btn) {
        btn.addEventListener('click', function () { range.value = btn.dataset.v; paint(); });
      });
      paint();
    }

    // ── 비용 원장: 날짜 그룹 + 소계 + 카테고리 스택바 ──
    function buildLedger(h, today0, split) {
      var costs = (h.costs || []).slice().sort(function (a, b) {
        return String(a.occurredAt || '').localeCompare(String(b.occurredAt || ''));
      });
      if (!costs.length) return '<h2 class="sec-title">비용 원장</h2><div class="dim">기록된 비용 없음</div>';

      // 카테고리 집계 — 도넛/파이 대신 CSS flex 스택바(세그먼트 5개, 라벨 필요)
      var byCat = {};
      costs.forEach(function (e) {
        if (e.direction === 'in') return;
        byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0);
      });
      var catTotal = Object.keys(byCat).reduce(function (s2, k) { return s2 + byCat[k]; }, 0);
      var bar = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).map(function (k, i) {
        return '<i style="flex-grow:' + byCat[k] + '" class="cs' + (i % 3) + '" title="' + esc(k) + ' ' + won(byCat[k]) + '">' +
          '<b>' + esc(k) + '</b> ' + (byCat[k] / catTotal * 100).toFixed(0) + '%</i>';
      }).join('');

      // 날짜 그룹
      var groups = [], cur = null;
      costs.forEach(function (e) {
        var key = e.occurredAt || '미지정';
        if (!cur || cur.key !== key) { cur = { key: key, items: [], sum: 0 }; groups.push(cur); }
        cur.items.push(e);
        cur.sum += (e.direction === 'in' ? -1 : 1) * (Number(e.amount) || 0);
      });

      var body = groups.map(function (g) {
        var future = g.key !== '미지정' && g.key > today0;
        return '<div class="grp' + (future ? ' planned' : '') + '">' +
          '<div class="grp-head"><span>' + esc(g.key) + (future ? ' <em>예정</em>' : '') + '</span>' +
            '<b>' + won(g.sum) + '</b></div>' +
          g.items.map(function (e) {
            return '<div class="crow">' +
              '<span class="c">' + esc(e.category) + (e.direction === 'in' ? ' <em>환급</em>' : '') + '</span>' +
              '<span class="a">' + (e.direction === 'in' ? '−' : '') + won(e.amount) + '</span>' +
              (e.memo ? '<span class="m">' + esc(e.memo) + '</span>' : '') +
            '</div>';
          }).join('') +
        '</div>';
      }).join('');

      // 미계상 확정 부채 — 원장 합계 어디에도 안 들어가던 것
      var ub = (h.unbookedLiabilities || []);
      var ubHtml = ub.length ? '<div class="grp unbooked">' +
        '<div class="grp-head"><span>미계상 확정 부채</span><b>' + won(L.unbookedTotal(h)) + '</b></div>' +
        ub.map(function (x) {
          return '<div class="crow"><span class="c">' + esc(x.label) + '</span>' +
            '<span class="a">' + won(x.amount) + '</span>' +
            (x.basis ? '<span class="m">' + esc(x.basis) + '</span>' : '') + '</div>';
        }).join('') + '</div>' : '';

      return '<h2 class="sec-title">비용 원장 ' +
          '<span class="sec-sum">집행 ' + won(split.executed) +
          (split.planned ? ' · 예정 ' + won(split.planned) : '') + '</span></h2>' +
        (bar ? '<div class="cost-bar">' + bar + '</div>' : '') +
        body + ubHtml;
    }

    // ── 매도가 현실성 — 시세·유사낙찰 대조 ──
    // 이 페이지의 가격 참조선은 전부 경매 세계 숫자(감정·중립·낙찰)다. 실제로 거래된 가격은
    // 하나도 그려지지 않는다. cd.naverData / cd.salesHistory 가 이미 로드돼 있는데 안 쓰였다.
    var MK = { W: 1040, H: 132, X0: 92, X1: 1010 };

    function buildMarket(h, f, cd, M0, today0) {
      if (!cd || f.wonPrice == null) return '';
      var nd = cd.naverData || {};
      var BE = L.breakEvenPrice(h, f, M0, cd);
      var trades = (nd.recentTrades || []).slice();
      var hist = (cd.salesHistory || []).slice();
      var ap = nd.askingPrice || {};

      // 표 — 사용자가 명시적으로 요구한 축. 점은 날짜·층·비고를 못 싣는다.
      var rows = [];
      var add = function (k, v, when, note, cls) { if (v != null) rows.push({ k: k, v: v, when: when || '', note: note || '', cls: cls || '' }); };
      add('호가 상단', ap.high, ap.count ? ap.count + '건' : '', '');
      add('호가 중앙', ap.median, ap.count ? ap.count + '건' : '', '');
      if (trades.length) {
        var hi = trades.reduce(function (a, b) { return b.price > a.price ? b : a; });
        add('실거래 최고', hi.price, hi.date, (hi.floor ? hi.floor + '층 ' : '') + (hi.type || ''));
      }
      add('손익분기 (' + M0 + '개월)', Math.round(BE), '', '이 위로 팔아야 본전', 'be-row');
      add('감정가', f.appraisalPrice, '', '');
      add('실거래 중앙 (6개월)', nd.real6moMedian, nd.real6moDate || '', '');
      if (nd.lastTrade) add('최근 실거래', nd.lastTrade.price, nd.lastTrade.date,
        (nd.lastTrade.floor ? nd.lastTrade.floor + '층' : ''));
      add('중립가 (모델)', cd.neutralSalePrice, '', '');
      add('호가 하단', ap.low, ap.count ? ap.count + '건' : '', '');
      add('내 낙찰가', f.wonPrice, f.wonDate || '', (f.bidderCount ? f.bidderCount + '명 응찰' : ''));
      hist.filter(function (x) { return !x.outlier; }).forEach(function (x) {
        add('유사 낙찰 ' + (x.dongHo || ''), x.soldPrice, x.saleDate,
          (x.bidders ? x.bidders + '명 · ' : '') + (x.soldRate ? '감정 ' + (x.soldRate * 100).toFixed(1) + '%' : ''));
      });
      rows.sort(function (a, b) { return b.v - a.v; });
      var tbody = rows.map(function (r) {
        var d = r.v - BE, isBE = r.cls === 'be-row';
        return '<tr class="' + r.cls + '"><th scope="row">' + esc(r.k) + '</th>' +
          '<td class="tot">' + won(r.v) + '</td>' +
          '<td class="when">' + esc(r.when) + '</td>' +
          '<td class="gap ' + (isBE ? '' : (d >= 0 ? 'pos' : 'neg')) + '">' +
            (isBE ? '<span class="z">—</span>' : signed(d)) + '</td>' +
          '<td class="note">' + esc(r.note) + '</td></tr>';
      }).join('');

      // 스트립 — x 도메인을 고정 클램프한다. 호가 상단에 스케일을 맡기면 결정이 벌어지는 구간이 눌린다.
      var vals = [f.wonPrice, BE, cd.neutralSalePrice, f.appraisalPrice]
        .concat(trades.map(function (t) { return t.price; }))
        .filter(function (v) { return v != null; });
      var lo = Math.min.apply(null, vals) * 0.985, hi2 = Math.max.apply(null, vals) * 1.015;
      var X = function (v) { return MK.X0 + (Math.max(lo, Math.min(hi2, v)) - lo) / (hi2 - lo) * (MK.X1 - MK.X0); };
      var xbe = X(BE);
      var svg =
        '<rect class="zone-lo" x="' + MK.X0 + '" y="14" width="' + (xbe - MK.X0).toFixed(1) + '" height="86"/>' +
        '<rect class="zone-hi" x="' + xbe.toFixed(1) + '" y="14" width="' + (MK.X1 - xbe).toFixed(1) + '" height="86"/>';
      if (ap.low != null && ap.high != null) {
        svg += '<rect class="band" x="' + X(ap.low).toFixed(1) + '" y="80" width="' +
          Math.max(2, X(ap.high) - X(ap.low)).toFixed(1) + '" height="16" rx="3"><title>호가 ' +
          eok(ap.low) + '~' + eok(ap.high) + '</title></rect>';
      }
      svg += '<text class="rowlab" x="' + (MK.X0 - 10) + '" y="38">실거래</text>';
      trades.forEach(function (t, i) {
        svg += '<circle class="trade' + (t.type === '직거래' ? ' self' : '') + '" cx="' + X(t.price).toFixed(1) +
          '" cy="' + (34 + (i % 2 ? 5 : -5)) + '" r="4.5"><title>' + esc(t.date) + ' ' + won(t.price) +
          ' ' + esc(t.type || '') + '</title></circle>';
      });
      svg += '<text class="rowlab" x="' + (MK.X0 - 10) + '" y="68">유사낙찰</text>';
      hist.forEach(function (x, i) {
        var cx = X(x.soldPrice), cy = 64 + (i % 2 ? 5 : -5);
        svg += '<rect class="auc' + (x.outlier ? ' out' : '') + '" x="' + (cx - 4).toFixed(1) + '" y="' + (cy - 4) +
          '" width="8" height="8" transform="rotate(45 ' + cx.toFixed(1) + ' ' + cy + ')"><title>' +
          esc(x.saleDate) + ' ' + won(x.soldPrice) + (x.outlier ? ' (이상치)' : '') + '</title></rect>';
      });
      svg += '<text class="rowlab" x="' + (MK.X0 - 10) + '" y="93">호가</text>';
      [{ v: f.wonPrice, t: '낙찰' }, { v: cd.neutralSalePrice, t: '중립' }, { v: BE, t: '본전', be: 1 }]
        .filter(function (r) { return r.v != null; })
        .forEach(function (r) {
          svg += '<line class="ref' + (r.be ? ' be' : '') + '" x1="' + X(r.v).toFixed(1) + '" y1="14" x2="' +
            X(r.v).toFixed(1) + '" y2="100"/>' +
            '<text class="rl' + (r.be ? ' be' : '') + '" x="' + X(r.v).toFixed(1) + '" y="112">' +
            esc(r.t) + ' ' + eok(r.v) + '</text>';
        });

      var age = nd.updatedAt ? L.daysBetween(nd.updatedAt, today0) : null;
      var fresh = age == null ? '' :
        '<span class="mk-fresh' + (age > 90 ? ' stale' : '') + '">시세 ' + age + '일 전 기준 (' + esc(nd.updatedAt) + ')</span>';
      return '<h2 class="sec-title">매도가 현실성 — 시세·유사낙찰 대조' + fresh + '</h2>' +
        '<svg class="mk-svg" viewBox="0 0 ' + MK.W + ' ' + MK.H + '" role="img" ' +
          'aria-label="실거래·유사낙찰·호가 대비 손익분기 위치">' + svg + '</svg>' +
        '<table class="mx mkt"><caption>' +
          '「본전 대비」가 이 표의 요점이다 — 음수면 그 가격에 팔았을 때 손실이라는 뜻이다. ' +
          '왼쪽 그림에서 빨간 영역이 본전 아래, 초록이 위다. 속 빈 동그라미는 직거래(시세 노이즈), ' +
          '점선 마름모는 이상치로 분류된 유사낙찰이다.' +
        '</caption>' +
        '<thead><tr><th scope="col">근거</th><th scope="col">가격</th><th scope="col">시점</th>' +
          '<th scope="col">본전 대비</th><th scope="col">비고</th></tr></thead>' +
        '<tbody>' + tbody + '</tbody></table>';
    }

    // ── 보유 진행 + 월별 부담 ──
    // milestones 는 이 섹션이 생기기 전까지 어디에도 렌더되지 않았다(옛 .steps CSS 는 함께 걷어냈다).
    // 그리고 '월 부담'은 HERO 숫자 하나뿐이라 "12월까지 얼마를 마련해둬야 하나"에 답하지 못했다.
    var STEP_ORDER = ['won', 'balance', 'eviction', 'repair', 'listed', 'sold'];

    function buildProgress(h, f, cd, M0, today0) {
      var ms = h.milestones || [];
      var byKey = {}; ms.forEach(function (m) { byKey[m.key] = m; });
      var known = STEP_ORDER.filter(function (k) { return byKey[k] && byKey[k].at; });
      if (!known.length) return '';   // 날짜 없는 회색 점 6개는 그리지 않는다

      var nextKey = null;
      for (var i = 0; i < STEP_ORDER.length; i++) {
        var mk = byKey[STEP_ORDER[i]];
        if (mk && !mk.at) { nextKey = STEP_ORDER[i]; break; }
      }
      var dday = function (iso) {
        var d = window.CalLib.daysUntil ? window.CalLib.daysUntil(iso)
              : Math.round((Date.parse(iso) - Date.parse(today0)) / 86400000);
        return d;
      };
      var nodes = STEP_ORDER.filter(function (k) { return byKey[k]; }).map(function (k) {
        var m = byKey[k], cls = m.at ? 'done' : (k === nextKey ? 'next' : 'pending'), dtxt = '';
        if (m.at) dtxt = m.at;
        else {
          // 목표일이 memo 산문 안에 있다(스키마에 targetAt 이 없다). 정규식은 폴백이고, 빗나가면 '미정'.
          var mm = /(\d{4}-\d{2}-\d{2})/.exec(m.memo || '');
          if (mm && k === nextKey) {
            var d = dday(mm[1]);
            dtxt = '목표 ' + mm[1].slice(5) + ' · ' + (d >= 0 ? 'D-' + d : 'D+' + (-d) + ' 지연');
            if (d < 0) dtxt = '<span class="late">' + dtxt + '</span>';
          } else if (k === nextKey) dtxt = '목표 미정';
        }
        return '<div class="nd ' + cls + '" title="' + esc(m.memo || STEP_LABEL[k] || k) + '"><i></i>' +
          '<div class="l">' + esc(STEP_LABEL[k] || k) + '</div>' +
          (dtxt ? '<div class="d">' + dtxt + '</div>' : '') + '</div>';
      }).join('');
      var nCols = STEP_ORDER.filter(function (k) { return byKey[k]; }).length;
      var nextMemo = nextKey && byKey[nextKey] && byKey[nextKey].memo
        ? '<div class="rail-memo"><b>다음 — ' + esc(STEP_LABEL[nextKey]) + '</b> · ' + esc(byKey[nextKey].memo) + '</div>' : '';

      // 월별 표
      var plan = L.monthlyPlan(h, f, cd, 12, today0);
      var monHtml = '';
      if (plan.length) {
        // 일정 열 — 마일스톤 날짜(확정·목표)와 미래 원장 항목을 월로 버킷한다.
        var ev = {};
        var push = function (ym, t) { if (!ym) return; (ev[ym] = ev[ym] || []).push(t); };
        ms.forEach(function (m) {
          if (m.at) push(m.at.slice(0, 7), STEP_LABEL[m.key] + ' ' + m.at.slice(5));
          else { var g = /(\d{4}-\d{2}-\d{2})/.exec(m.memo || ''); if (g) push(g[1].slice(0, 7), STEP_LABEL[m.key] + ' 목표 ' + g[1].slice(5)); }
        });
        (h.costs || []).forEach(function (c) {
          if (c.occurredAt > today0) push(String(c.occurredAt).slice(0, 7), c.category + ' ' + won(c.amount));
        });
        var body = plan.map(function (r, i) {
          var curYM = String(today0).slice(0, 7);
          // 현재 월은 '실적'이 아니다 — 아직 안 지난 날짜의 항목이 섞여 있다.
          var tag = r.month < curYM ? '실적' : (r.month === curYM ? '진행중' : '');
          var cls = (r.isPast ? '' : 'future') + (i === M0 ? ' m0' : '');
          return '<tr class="' + cls.trim() + '">' +
            '<th scope="row">' + r.month + (tag ? '<span class="badge-real">' + tag + '</span>' : '') + '</th>' +
            '<td class="amt">' + (r.loanInterest ? won(r.loanInterest) : '<span class="z">—</span>') + '</td>' +
            '<td class="amt">' + (r.loanPrincipal ? won(r.loanPrincipal) : '<span class="z">—</span>') + '</td>' +
            '<td class="amt">' + (r.otherInterest ? won(r.otherInterest) : '<span class="z">—</span>') + '</td>' +
            '<td class="tot">' + won(r.cash) + '</td>' +
            '<td class="cum">' + won(r.cumCash) + '</td>' +
            '<td class="amt">' + eok(r.breakEven) + '</td>' +
            '<td class="ev">' + (ev[r.month] || []).map(esc).join(' · ') + '</td></tr>';
        }).join('');
        monHtml = '<table class="mx mon"><caption>' +
            '잔금월부터 12개월. <b>원금상환분은 비용이 아니라 부채 감소</b>라서 이자와 나눠 놓았다 — ' +
            '「월 현금」은 통장에서 나가는 돈이고, 손익에 잡히는 건 이자뿐이다. ' +
            '「본전 매도가」는 그 달까지 보유했을 때의 본전선이다. 파란 줄이 기본 가정(' + M0 + '개월).' +
          '</caption>' +
          '<thead><tr><th scope="col">월</th><th scope="col">경락 이자</th><th scope="col">경락 원금</th>' +
            '<th scope="col">기타 조달 이자</th><th scope="col">월 현금</th><th scope="col">누적 현금</th>' +
            '<th scope="col">본전 매도가</th><th scope="col">일정</th></tr></thead>' +
          '<tbody>' + body + '</tbody></table>' +
          '<div class="wf-note">' + M0 + '개월 누적 현금 <b>' + won(plan[Math.min(M0, plan.length - 1)].cumCash) + '</b>' +
            ' · 같은 기간 금융비용 <b>' + won(L.financeCost(h, M0)) + '</b> — 두 값은 기준이 다르다. ' +
            '누적 현금은 통장에서 나간 돈(원금상환 포함)이고, 금융비용은 손익에 잡히는 이자에 ' +
            '중도상환수수료를 더한 값이다. 달라야 정상이다.' +
          '</div>';
      }

      return '<h2 class="sec-title">보유 진행 · 월별 부담</h2>' +
        '<div class="rail6" style="grid-template-columns:repeat(' + nCols + ',1fr)">' + nodes + '</div>' +
        nextMemo + (monHtml ? '<div class="mx-sep"></div>' + monHtml : '');
    }

    // ── 원가 브릿지 — 낙찰가에서 손익분기까지 ──
    // HERO 의 '투입 원가'와 '손익분기 매도가'는 지금 관계가 안 보이는 두 숫자다.
    // 그 사이 웨지를 구성하는 항목들이 서로 다른 네 곳에 흩어져 있고, 특히
    // 중개수수료는 breakEvenPrice 의 /(1−b) 안에만 숨어 있어 어디에도 안 보인다.
    var WF = { W: 1040, H: 300, X0: 76, X1: 1004, Y0: 24, Y1: 236 };

    function buildBridge(h, f, cd, M0, today0) {
      if (f.wonPrice == null) return '';
      var C = L.totalCost(h, f), acq = L.acquisitionCosts(h);
      var fin = L.financeCost(h, M0);
      var budget = Math.max(L.plannedTotal(h, cd), L.variableExecuted(h));
      var unbook = L.unbookedTotal(h);
      var BE = L.breakEvenPrice(h, f, M0, cd);
      // 중개수수료는 곱셈으로 다시 구하지 않고 잔차로 낸다 — 요율이 바뀌어도 브릿지가 구조적으로 닫힌다.
      var brokerage = BE - (C + fin + budget + unbook);
      // 금융비용 중 이미 낸 몫 — 이자와 앞으로 낼 이자가 한 덩어리로 보이면 안 된다.
      var finDone = (h.costs || []).reduce(function (s2, c) {
        return (L.FIN_CATS.indexOf(c.category) >= 0 && c.occurredAt <= today0) ? s2 + c.amount : s2;
      }, 0);

      var bars = [{ k: 'base', label: '낙찰가', v: f.wonPrice, cls: 'b-anchor' }];
      if (acq)       bars.push({ k: 'acq',  label: '취득부대비', v: acq, cls: 'b-done' });
      if (fin)       bars.push({ k: 'fin',  label: '금융비용', sub: M0 + '개월', v: fin, cls: 'b-plan', done: Math.min(finDone, fin) });
      if (budget)    bars.push({ k: 'var',  label: '예정 변동비', v: budget, cls: 'b-plan' });
      if (unbook)    bars.push({ k: 'ub',   label: '미계상 부채', v: unbook, cls: 'b-unbook' });
      if (brokerage > 0) bars.push({ k: 'brk', label: '매도 중개수수료', sub: '매도가 비례', v: brokerage, cls: 'b-plan' });
      bars.push({ k: 'total', label: '손익분기 매도가', v: BE, cls: 'b-total' });
      // 2바 폭포는 그냥 막대 두 개다 — 중간 항목이 하나도 없으면 섹션째 숨긴다.
      if (bars.length < 4) return '';

      var wedge = BE - f.wonPrice;
      if (!(wedge > 0)) return '';
      var yMin = f.wonPrice - wedge * 0.35, yMax = BE + wedge * 0.15;
      var Y = function (v) { return WF.Y1 - (v - yMin) / (yMax - yMin) * (WF.Y1 - WF.Y0); };
      var slot = (WF.X1 - WF.X0) / bars.length, bw = Math.min(76, slot * 0.56);

      var svg = '', cum = f.wonPrice;
      bars.forEach(function (b, i) {
        var cx = WF.X0 + slot * (i + 0.5), x = cx - bw / 2;
        var top, bot;
        if (b.k === 'base' || b.k === 'total') { top = Y(b.v); bot = WF.Y1; }
        else { top = Y(cum + b.v); bot = Y(cum); }
        svg += '<rect class="' + b.cls + '" x="' + x.toFixed(1) + '" y="' + top.toFixed(1) +
               '" width="' + bw.toFixed(1) + '" height="' + Math.max(2, bot - top).toFixed(1) +
               '" rx="2"><title>' + esc(b.label) + ' ' + won(b.v) + '</title></rect>';
        // 금융비용 바 안에서 집행분을 아래쪽에 진하게
        if (b.done > 0) {
          var dTop = Y(cum + b.done);
          svg += '<rect class="b-done" x="' + x.toFixed(1) + '" y="' + dTop.toFixed(1) +
                 '" width="' + bw.toFixed(1) + '" height="' + Math.max(1.5, bot - dTop).toFixed(1) +
                 '" rx="2"><title>이미 낸 이자 ' + won(b.done) + '</title></rect>';
        }
        // 절단 표시 — 축이 0 에서 시작하지 않는다는 사실을 바닥에 명시한다.
        if (b.k === 'base' || b.k === 'total') {
          svg += '<path class="cut" d="M' + (x + 6) + ',' + (WF.Y1 - 3) + ' l6,-5 l6,10 l6,-5"/>';
        }
        var vl = (b.k === 'base' || b.k === 'total') ? won(b.v) : '+' + won(b.v).slice(1);
        svg += '<text class="val' + (b.k === 'total' ? ' big' : '') + '" x="' + cx.toFixed(1) +
               '" y="' + (top - 7).toFixed(1) + '">' + vl + '</text>';
        svg += '<text class="lab" x="' + cx.toFixed(1) + '" y="' + (WF.Y1 + 20) + '">' + esc(b.label) + '</text>';
        if (b.sub) svg += '<text class="lab two" x="' + cx.toFixed(1) + '" y="' + (WF.Y1 + 34) + '">' + esc(b.sub) + '</text>';
        if (i && b.k !== 'total') {
          var px = WF.X0 + slot * (i - 0.5) + bw / 2, py = Y(cum);
          svg += '<line class="conn" x1="' + px.toFixed(1) + '" y1="' + py.toFixed(1) +
                 '" x2="' + x.toFixed(1) + '" y2="' + py.toFixed(1) + '"/>';
        }
        if (b.k !== 'base' && b.k !== 'total') cum += b.v;
      });

      var split = window.CalLib.splitCosts(h.costs, today0);
      return '<h2 class="sec-title">원가 브릿지 — 낙찰가에서 손익분기까지</h2>' +
        '<svg class="wf-svg" viewBox="0 0 ' + WF.W + ' ' + WF.H + '" role="img" ' +
          'aria-label="낙찰가 ' + won(f.wonPrice) + ' 에서 손익분기 매도가 ' + won(BE) +
          ' 까지 ' + won(wedge) + ' 의 구성">' + svg + '</svg>' +
        '<div class="wf-axis">세로축 절단 — ' + eok(yMin) + ' ~ ' + eok(yMax) + ' 구간만 그렸다 ' +
          '(0 기준이면 가장 작은 항목이 1px 아래로 사라진다). 바닥의 지그재그가 절단 지점이다.</div>' +
        '<div class="wf-legend">' +
          '<span><i class="k-done"></i>집행 완료</span>' +
          '<span><i class="k-plan"></i>예정·미집행</span>' +
          (unbook ? '<span><i class="k-unbook"></i>미계상 확정 부채</span>' : '') +
        '</div>' +
        '<div class="wf-note">낙찰가 대비 <b>+' + won(wedge).slice(1) + '</b> ' +
          '(+' + (wedge / f.wonPrice * 100).toFixed(2) + '%) · ' +
          '집행 완료 <b>' + won(split.executed) + '</b> / 미집행 <b>' + won(wedge - split.executed) + '</b>' +
        '</div>';
    }

    // ── 항목별 비용 매트릭스 ──
    // 원장(집행/예정)·예산·미계상은 성격이 다르고 서로 배타적이라 한 표에서 열로 갈라야
    // 이중계상 없이 "어디에 얼마 나갔고 얼마 더 나갈지"가 한눈에 잡힌다.
    function buildCostMatrix(h, today0, cd) {
      var m = L.costByCategory(h, today0, cd);
      if (!m.rows.length) return '';
      var T = m.totals.total || 1;
      var cell = function (v) { return v ? '<td class="amt">' + won(v) + '</td>' : '<td class="amt"><span class="z">—</span></td>'; };
      var body = m.rows.map(function (r) {
        var pct = r.total / T * 100;
        return '<tr><th scope="row">' + esc(r.category) + '</th>' +
          cell(r.ledgerExecuted) + cell(r.ledgerPlanned) + cell(r.budget) + cell(r.unbooked) +
          '<td class="tot">' + won(r.total) + '</td>' +
          '<td class="share"><i style="width:' + Math.max(1, pct * 0.9).toFixed(1) + '%"></i>' +
            '<span>' + pct.toFixed(1) + '%</span></td></tr>';
      }).join('');
      return '<h2 class="sec-title">항목별 비용</h2>' +
        '<table class="mx"><caption>' +
          '<b>집행</b> 원장에 있고 오늘까지 나간 돈 · <b>예정</b> 원장에 있으나 날짜가 미래 · ' +
          '<b>예산</b> 원장 밖 계획분 · <b>미계상</b> 확정 채무인데 원장에 아직 없음. ' +
          '네 갈래는 서로 배타적이라 합계에 이중계상이 없다.' +
        '</caption>' +
        '<thead><tr><th scope="col">항목</th><th scope="col">집행</th><th scope="col">예정</th>' +
          '<th scope="col">예산</th><th scope="col">미계상</th><th scope="col">합계</th>' +
          '<th scope="col">비중</th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
        '<tfoot><tr><th scope="row">합계</th>' +
          '<td>' + won(m.totals.ledgerExecuted) + '</td><td>' + won(m.totals.ledgerPlanned) + '</td>' +
          '<td>' + won(m.totals.budget) + '</td><td>' + won(m.totals.unbooked) + '</td>' +
          '<td>' + won(m.totals.total) + '</td><td>100%</td></tr></tfoot></table>';
    }

    // ── 매도가 × 보유기간 민감도 ──
    // 매도 시나리오 차트는 '본전선 한 줄'만 보여준다. 실제 판단은 "3.46억에 5개월이면?"
    // 처럼 두 축을 동시에 물어보는 형태라 격자가 필요하다. 부호 경계가 대각선으로 걸린다.
    function buildSensitivity(h, f, cd, anchors, M0) {
      if (f.wonPrice == null) return '';
      // 가격 축은 앵커(낙찰·중립·본전·감정)를 그대로 행으로 쓴다. 균등 분할하면 정작
      // 기준이 되는 가격이 행에 없어 표를 읽어도 판단으로 이어지지 않는다.
      // 백만원 단위로 접어 중복을 없앤다 — 본전과 감정이 34만원 차이라 따로 두면 같은 줄이 두 번 나온다.
      var pool = {};
      var add = function (v, label) {
        var k = Math.round(v / 1e6);
        if (!pool[k]) pool[k] = { v: k * 1e6, labels: [] };
        if (label && pool[k].labels.indexOf(label) < 0) pool[k].labels.push(label);
      };
      (anchors || []).forEach(function (a) { add(a.v, a.label); });
      var ks = Object.keys(pool).map(Number);
      var lo = Math.min.apply(null, ks), hi = Math.max.apply(null, ks), span = Math.max(1, hi - lo);
      [lo - span * 0.3, hi + span * 0.3, hi + span * 0.6].forEach(function (k) { add(k * 1e6, null); });
      for (var t = 1; t <= 3; t++) add((lo + span * t / 4) * 1e6, null);
      var rows = Object.keys(pool).map(function (k) { return pool[k]; })
        .sort(function (a, b) { return a.v - b.v; });

      var months = [2, 3, 4, 6, 9, 12];
      var g = L.sensitivityGrid(h, f, rows.map(function (r) { return r.v; }), months, cd);
      // 색은 부호, 농도는 크기. 최대 절대값 대비 3단.
      var maxAbs = 1;
      g.rows.forEach(function (r) { r.cells.forEach(function (c) { maxAbs = Math.max(maxAbs, Math.abs(c.profit)); }); });
      var tone = function (c) {
        var t2 = Math.abs(c.profit) / maxAbs;
        return (c.sign === 'gain' ? 'g' : 'l') + (t2 > 0.55 ? 3 : (t2 > 0.22 ? 2 : 1));
      };
      var body = g.rows.map(function (r, i) {
        var labels = rows[i].labels;
        return '<tr><th scope="row">' + eok(r.price) +
            labels.map(function (x) { return '<span class="tagp">' + esc(x) + '</span>'; }).join('') + '</th>' +
          r.cells.map(function (c) {
            return '<td class="c ' + tone(c) + '">' + signed(c.profit) + '</td>';
          }).join('') + '</tr>';
      }).join('');
      return '<h2 class="sec-title">매도가 × 보유기간 — 세전이익</h2>' +
        '<table class="mx heat"><caption>' +
          '행은 매도가, 열은 잔금일로부터 보유 개월. 칸은 그 조합의 세전이익이다. ' +
          '초록이 이익 · 빨강이 손실이고 농도는 금액 크기다. 맨 아래 줄은 각 기간의 본전 매도가 — ' +
          '보유가 길수록 올라간다.' +
        '</caption>' +
        '<thead><tr><th scope="col">매도가</th>' +
          g.months.map(function (m) { return '<th scope="col">' + m + '개월</th>'; }).join('') +
        '</tr></thead><tbody>' + body + '</tbody>' +
        '<tfoot><tr><th scope="row">본전 매도가</th>' +
          g.breakEven.map(function (b) { return '<td>' + eok(b) + '</td>'; }).join('') +
        '</tr></tfoot></table>';
    }

    function drawDetail() {
      var h = H[sel];
      var f = L.deriveAuctionFacts(h, RESULTS, CASES);
      var cd = (CASES || []).find(function (c) { return c.id === L.caseIdOf(h.sourceResultKey); }) || null;
      var d = document.getElementById('detail');
      var today0 = today();
      var split = window.CalLib.splitCosts(h.costs, today0);

      // ── 지표 (전부 holdings-lib. 여기서 산식을 만들지 않는다) ──
      var C   = L.totalCost(h, f);
      var E   = L.equity(h, f);
      var V   = L.variableCosts(h, cd);
      var rr  = L.monthlyRunRate(h);
      var M0  = 4;                                   // 기본 가정: 잔금 후 4개월 매도
      var BE  = L.breakEvenPrice(h, f, M0, cd);
      var slope = L.breakEvenPrice(h, f, M0 + 1, cd) - BE;
      var anchors = saleAnchors(f, cd, h, M0);
      var defaultSale = (cd && cd.neutralSalePrice) || f.appraisalPrice || Math.round(BE);
      var profit0 = L.pretaxProfit(h, f, defaultSale, M0, cd);
      var realized = L.realizedPretax(h, f);

      // ── #0 식별 바 ──
      var chips = [
        f.complex && '<span class="chip"><b>' + esc(f.complex) + '</b></span>',
        f.dongHo && '<span class="chip">' + esc(f.dongHo) + '</span>',
        f.court && '<span class="chip">' + esc(f.court) + '</span>',
        f.areaSqm && '<span class="chip">전용 ' + f.areaSqm + '㎡</span>',
        '<span class="chip">낙찰 <b>' + won(f.wonPrice) + '</b></span>',
        f.appraisalPrice && '<span class="chip">감정 ' + won(f.appraisalPrice) + '</span>',
        f.bidderCount != null && '<span class="chip">' + f.bidderCount + '명 응찰</span>',
        '<span class="chip">' + (h.disposition === 'sold' ? '매도완료' : '보유 D+' + (L.holdingDays(h, today0) || 0)) + '</span>'
      ].filter(Boolean).join('');

      // 낙찰가가 없으면(= sourceResultKey 가 results.js 와 매칭 안 됨) 모든 지표가 무의미해진다.
      // 구 코드는 그래도 계산해서 '낙찰가 +Infinity%', 음수 자기자본 같은 숫자를 자신 있게 표시했다.
      // 새 물건을 낙찰받고 results.js 갱신 전에 원장을 먼저 쓰면 실제로 이 상황이 된다.
      if (f.wonPrice == null) {
        d.innerHTML =
          '<div class="idbar">' + chips + '</div>' +
          '<div class="card nolink"><b>낙찰 정보를 찾을 수 없습니다</b>' +
          '<p>원장의 <code>sourceResultKey</code> = <code>' + esc(h.sourceResultKey || '(없음)') + '</code> 가 ' +
          'results.js 의 어떤 항목과도 매칭되지 않습니다. 낙찰가를 모르면 투입원가·손익분기·손익을 ' +
          '계산할 수 없어 지표를 표시하지 않습니다.</p>' +
          '<p class="dim">해결: sourcing 회고로 results.js 를 갱신하거나, 원장의 sourceResultKey 를 ' +
          '복합키(<code>사건번호@매각일</code>) 형식으로 맞추세요.</p></div>';
        return;
      }

      // ── #1 HERO — 결론을 맨 위로. 구 구조는 손익이 6번째였고 그마저 "미정"이었다 ──
      function heroCard(label, value, sub, cls) {
        return '<div class="hero-card"><div class="l">' + esc(label) + '</div>' +
          '<div class="v ' + (cls || '') + '">' + value + '</div>' +
          '<div class="s">' + sub + '</div></div>';
      }
      var heroProfit = (realized != null)
        ? heroCard('실현 손익', signed(realized), '매도 ' + esc(h.resaleClosedAt || '') + ' · 세전',
                   realized >= 0 ? 'pos' : 'neg')
        : heroCard((cd && cd.neutralSalePrice ? '중립가' : '감정가') + ' 매도 시', signed(profit0),
                   eok(defaultSale) + ' · ' + M0 + '개월 · 세전<br>본전 ' + eok(BE),
                   profit0 >= 0 ? 'pos' : 'neg');
      var hero =
        '<div class="hero">' +
          heroCard('투입 원가', won(C),
            '낙찰 ' + eok(f.wonPrice) + ' + 부대비 ' + won(L.acquisitionCosts(h)).slice(1) + '<br>' +
            (E === 0 ? '<b class="warn">자기자본 0 · 전액 차입</b>' : '자기자본 ' + won(E))) +
          heroCard('손익분기 매도가', won(Math.round(BE)),
            (f.wonPrice ? '낙찰가 +' + ((BE / f.wonPrice - 1) * 100).toFixed(2) + '%<br>' : '') +
            '<b class="warn">매월 +' + won(Math.round(slope)).slice(1) + '</b> · ' + M0 + '개월 기준') +
          heroCard('월 부담', won(Math.round(rr.cash)),
            '현금 기준 · 손익 기준 ' + won(Math.round(rr.interest)).slice(1) + '<br>원금상환분은 비용이 아니라 부채 감소') +
          heroProfit +
        '</div>';

      // ── #2 리스크 스트립 — 결론을 무효화할 수 있는 것 ──
      var riskItems = [];
      var unbooked = L.unbookedTotal(h);
      if (unbooked > 0) {
        riskItems.push({ t: '미계상 부채', d: '확정 채무 ' + won(unbooked) + ' 이 위 손익에 반영됐다 — 원장 costs 에는 아직 없다.' });
      }
      (h.risks || []).forEach(function (r) { riskItems.push({ t: r.label, d: r.detail }); });
      if (!riskItems.length && h.notes) {
        String(h.notes).split('\n').forEach(function (ln2) {
          var m2 = /^\s*⚠️?\s*(.{0,300})/.exec(ln2);
          if (m2 && riskItems.length < 3) {
            var txt = m2[1];
            var i2 = txt.indexOf(':');
            riskItems.push({ t: i2 > 0 && i2 < 20 ? txt.slice(0, i2) : '주의', d: i2 > 0 && i2 < 20 ? txt.slice(i2 + 1) : txt });
          }
        });
      }
      var riskHtml = riskItems.length
        ? '<div class="risk-strip">' + riskItems.map(function (r) {
            return '<div class="risk-row"><b>' + esc(r.t) + '</b><span>' + esc(r.d) + '</span></div>';
          }).join('') + '</div>'
        : '';

      // ── #3 매도 시나리오 — 손익분기 곡선 + 슬라이더 ──
      var simHtml = (realized != null) ? '' : buildScenario(h, f, cd, anchors, defaultSale, M0);

      // ── #4 자금 구조 — 구 §자금·대출 + §조달내역 통합(같은 사실의 두 표현이었다) ──
      var pctf = function (r) { return r == null ? null : (r * 100).toFixed(2).replace(/\.?0+$/, '') + '%'; };
      var ln = h.loan || {}, rp = ln.repayment || {};
      var fundTotal = (h.funding || []).reduce(function (s2, x) { return s2 + (Number(x.amount) || 0); }, 0);
      var fundBar = (h.funding || []).map(function (x, i) {
        var w = fundTotal ? (x.amount / fundTotal * 100) : 0;
        return '<i style="flex-grow:' + x.amount + '" class="fs' + (i % 2) + '">' +
          '<b>' + esc(x.source) + '</b> ' + eok(x.amount) + ' · ' + w.toFixed(0) + '%' +
          (x.rate ? ' · ' + pctf(x.rate) : '') + '</i>';
      }).join('');
      var fundHtml =
        '<h2 class="sec-title">자금 구조</h2>' +
        (fundBar ? '<div class="fund-bar">' + fundBar + '</div>' : '') +
        '<div class="fund-eq' + (E === 0 ? ' warn' : '') + '">자기자본 ' + won(E) +
          (E === 0 ? ' (100% 차입)' : '') + '</div>' +
        '<div class="fund-terms">' +
          [ rp.type && ln.term && esc(ln.term) + ' ' + esc(rp.type),
            rp.monthlyPayment && '월 ' + won(rp.monthlyPayment) + (rp.dayOfMonth ? ' (매월 ' + rp.dayOfMonth + '일)' : ''),
            ln.prepayFeeRate != null && '중도상환 ' + pctf(ln.prepayFeeRate)
          ].filter(Boolean).join(' · ') +
          (rp.exitPlan ? '<br><span class="dim">출구: ' + esc(rp.exitPlan) + '</span>' : '') +
        '</div>';

      // ── #5 비용 원장 — 날짜 그룹 + 소계. 6건 중 4건이 같은 날이라 날짜 컬럼이 낭비였다 ──
      var ledgerHtml = buildLedger(h, today0, split);
      var bridgeHtml = (realized != null) ? '' : buildBridge(h, f, cd, M0, today0);
      var marketHtml = (realized != null) ? '' : buildMarket(h, f, cd, M0, today0);
      var progHtml = buildProgress(h, f, cd, M0, today0);
      var matrixHtml = buildCostMatrix(h, today0, cd);
      var heatHtml = (realized != null) ? '' : buildSensitivity(h, f, cd, anchors, M0);

      // ── #6 계획 vs 실제 (접힘) ──
      var fcHtml = forecastHtml(h, f, split);
      var fcSec = fcHtml ? '<details class="fold"><summary>계획 vs 실제 (모델 검증)</summary>' + fcHtml + '</details>' : '';

      // ── #7 메모 (접힘, ★/⚠️ 배지) ──
      var notesHtml = '';
      if (h.notes) {
        var lines = String(h.notes).split('\n');
        var stars = lines.filter(function (x) { return /^\s*★/.test(x); }).length;
        var warns = lines.filter(function (x) { return /^\s*⚠/.test(x); }).length;
        notesHtml = '<details class="fold"><summary>메모' +
          (stars ? ' <span class="nb star">★' + stars + '</span>' : '') +
          (warns ? ' <span class="nb warn">⚠' + warns + '</span>' : '') +
          '</summary><div class="notes">' + lines.map(function (x) {
            var cls = /^\s*★/.test(x) ? ' class="star"' : (/^\s*⚠/.test(x) ? ' class="warn"' : '');
            return x.trim() ? '<p' + cls + '>' + esc(x) + '</p>' : '';
          }).join('') + '</div></details>';
      }

      d.innerHTML =
        '<div class="idbar">' + chips +
          (f.reportUrl ? '<a class="rep" href="../calendar/' + esc(f.reportUrl) + '">상세 분석 보고서 ↗</a>' : '') +
        '</div>' +
        hero + riskHtml +
        (bridgeHtml ? '<div class="card">' + bridgeHtml + '</div>' : '') +
        simHtml +
        (heatHtml ? '<div class="card">' + heatHtml + '</div>' : '') +
        (marketHtml ? '<div class="card">' + marketHtml + '</div>' : '') +
        '<div class="card">' + fundHtml + '</div>' +
        (progHtml ? '<div class="card">' + progHtml + '</div>' : '') +
        '<div class="card">' + ledgerHtml +
          (matrixHtml ? '<div class="mx-sep"></div>' + matrixHtml : '') + '</div>' +
        fcSec + notesHtml;

      if (!realized) bindScenario(h, f, cd, M0);
    }

    draw();
  }
})();
</script>
</body>
</html>
